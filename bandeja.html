<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mensajes - Mi Fans</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --of-blue: #00AFF0;
            --of-gray: #8A96A3;
            --of-bg: #FFFFFF;
            --of-border: #EAEAEA;
            --of-text: #242529;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Roboto", Helvetica, Arial, sans-serif;
            display: flex; justify-content: center;
        }

        .app-container {
            width: 100%; max-width: 500px; height: 100dvh;
            background: var(--of-bg); display: flex; flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        .top-header {
            background: var(--of-bg); padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--of-border); z-index: 10;
        }

        .header-left { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .back-icon { width: 24px; height: 24px; fill: none; stroke: var(--of-text); stroke-width: 2; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--of-text); margin: 0; }
        .action-icon { width: 24px; height: 24px; fill: none; stroke: var(--of-text); stroke-width: 2; cursor: pointer; }

        .chat-list { flex-grow: 1; overflow-y: auto; background: #fff; }
        
        .chat-item {
            display: flex; align-items: center; padding: 15px;
            border-bottom: 1px solid var(--of-border); cursor: pointer; transition: 0.2s;
        }
        .chat-item:active { background: #f9f9f9; }
        
        .chat-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; margin-right: 15px; }
        
        .chat-info { flex-grow: 1; overflow: hidden; }
        .chat-name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .chat-name { font-weight: 700; font-size: 16px; color: var(--of-text); }
        .chat-time { font-size: 12px; color: var(--of-gray); }
        
        .chat-preview {
            font-size: 14px; color: var(--of-gray); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        .unread .chat-name { color: var(--of-text); }
        .unread .chat-preview { font-weight: 700; color: var(--of-text); }
        .unread-dot {
            width: 10px; height: 10px; background: var(--of-blue);
            border-radius: 50%; display: inline-block; margin-left: 8px;
        }

        #loadingScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--of-bg);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            color: var(--of-blue); font-weight: bold; font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="loadingScreen">Cargando Mensajes...</div>

        <header class="top-header">
            <div class="header-left" onclick="window.location.href='index.html'">
                <svg class="back-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <h1 class="header-title">Mensajes</h1>
            </div>
            <svg class="action-icon" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </header>

        <main class="chat-list" id="chatList">
            <!-- Conversación 1 (Lleva al chat real pasando un ID por la URL) -->
            <div class="chat-item unread" onclick="abrirChatPrivado('usuario_demo_1')">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Rev" class="chat-avatar">
                <div class="chat-info">
                    <div class="chat-name-row">
                        <span class="chat-name">Revolution Team <span class="unread-dot"></span></span>
                        <span class="chat-time">Ahora</span>
                    </div>
                    <div class="chat-preview">¡Hola! ¿Viste la nueva actualización?</div>
                </div>
            </div>

            <!-- Conversaciones Simuladas -->
            <div class="chat-item" onclick="abrirChatPrivado('usuario_demo_2')">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Mariana" class="chat-avatar">
                <div class="chat-info">
                    <div class="chat-name-row">
                        <span class="chat-name">Mariana Lopez</span>
                        <span class="chat-time">2 h</span>
                    </div>
                    <div class="chat-preview">Me parece excelente la idea de los perfiles.</div>
                </div>
            </div>

            <div class="chat-item" onclick="abrirChatPrivado('usuario_demo_3')">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Carlos" class="chat-avatar">
                <div class="chat-info">
                    <div class="chat-name-row">
                        <span class="chat-name">Carlos_M</span>
                        <span class="chat-time">Ayer</span>
                    </div>
                    <div class="chat-preview">🎤 Nota de voz (0:15)</div>
                </div>
            </div>
        </main>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBTp1VWtvkbSueprfAPhJ0EpxSmKfEwtzc",
            authDomain: "mi-fans-2d49e.firebaseapp.com",
            projectId: "mi-fans-2d49e",
            storageBucket: "mi-fans-2d49e.firebasestorage.app",
            messagingSenderId: "217541513154",
            appId: "1:217541513154:web:df760909e97bd3abb8905b"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('loadingScreen').style.display = 'none';
            } else {
                window.location.href = "login.html";
            }
        });

        function abrirChatPrivado(targetUid) {
            // Pasamos el ID de la otra persona por la URL
            window.location.href = `chat.html?id=${targetUid}`;
        }
    </script>
</body>
</html>
