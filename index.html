<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inicio - Mi Fans</title>
    
    <!-- SDKs de Firebase (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --of-blue: #00AFF0;
            --of-gray: #8A96A3;
            --of-bg: #FFFFFF;
            --of-border: #EAEAEA;
            --of-text: #242529;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Roboto", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            background: var(--of-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        .top-header {
            background: var(--of-bg);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--of-border);
            z-index: 10;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .user-avatar-small { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; cursor: pointer; }
        .logo-text { font-size: 20px; font-weight: 800; color: var(--of-text); margin: 0; letter-spacing: -0.5px; }

        .header-actions { display: flex; gap: 15px; align-items: center; }
        .action-icon { width: 24px; height: 24px; fill: none; stroke: var(--of-gray); stroke-width: 1.5; cursor: pointer; transition: 0.2s; }
        .action-icon:active { stroke: var(--of-blue); transform: scale(0.95); }

        .feed-container {
            flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column;
            padding-bottom: 55px; background: #fdfdfd;
        }

        .new-post-box {
            background: var(--of-bg); padding: 15px; display: flex; align-items: center;
            gap: 10px; border-bottom: 5px solid #f4f4f4;
        }
        .new-post-input { flex-grow: 1; background: transparent; border: none; font-size: 15px; color: var(--of-text); outline: none; }
        .new-post-input::placeholder { color: var(--of-gray); }
        .new-post-icon { width: 22px; height: 22px; stroke: var(--of-blue); fill: none; stroke-width: 2; cursor: pointer; }

        .stories-container {
            background: var(--of-bg); padding: 15px 0 15px 15px; display: flex; gap: 15px;
            overflow-x: auto; overflow-y: hidden; border-bottom: 1px solid var(--of-border);
            scrollbar-width: none; flex-shrink: 0; min-height: 80px; align-items: flex-start;
        }
        .stories-container::-webkit-scrollbar { display: none; }
        
        .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; width: 60px; flex-shrink: 0; }
        .story-ring { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--of-blue); display: flex; justify-content: center; align-items: center; padding: 2px; }
        .story-ring.add-story { border: 2px dashed var(--of-gray); position: relative; }
        .add-badge { position: absolute; bottom: -2px; right: -2px; background: var(--of-blue); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: bold; border: 2px solid var(--of-bg); }
        .story-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .story-name { font-size: 11px; color: var(--of-gray); width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .post-card { background: var(--of-bg); display: flex; flex-direction: column; border-bottom: 10px solid #f4f4f4; }
        .post-header { padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .post-header-left { display: flex; align-items: center; gap: 12px; }
        .post-header-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
        .post-author-info { display: flex; flex-direction: column; }
        .post-author-name { font-weight: 700; color: var(--of-text); font-size: 15px; display: flex; align-items: center; gap: 4px; }
        .post-author-handle { font-size: 13px; color: var(--of-gray); }
        .verified-badge { width: 14px; height: 14px; fill: var(--of-blue); }
        .post-time { font-size: 12px; color: var(--of-gray); }
        .post-text { padding: 0 15px 12px 15px; font-size: 15px; color: var(--of-text); line-height: 1.5; }
        .post-image { width: 100%; max-height: 500px; object-fit: cover; display: block; }

        .post-actions-bar { display: flex; padding: 12px 15px; justify-content: space-between; align-items: center; }
        .left-actions { display: flex; gap: 20px; align-items: center; }
        .action-group { display: flex; align-items: center; gap: 6px; color: var(--of-gray); font-size: 14px; font-weight: 500; cursor: pointer;}
        .post-action-icon { width: 22px; height: 22px; fill: none; stroke: var(--of-gray); stroke-width: 1.5; transition: 0.2s; }
        .action-group:active .post-action-icon { stroke: var(--of-blue); transform: scale(0.9); }
        .tip-btn { display: flex; align-items: center; gap: 6px; color: var(--of-blue); font-size: 14px; font-weight: 600; text-transform: uppercase; cursor: pointer; }
        .tip-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .post-likes { padding: 0 15px 15px 15px; font-weight: 400; font-size: 14px; color: var(--of-gray); }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; background: var(--of-bg);
            display: flex; justify-content: space-around; align-items: center; height: 55px;
            padding-bottom: env(safe-area-inset-bottom, 10px); border-top: 1px solid var(--of-border); z-index: 20;
        }
        .nav-item { width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; position: relative; }
        .nav-icon { width: 26px; height: 26px; fill: none; stroke: var(--of-gray); stroke-width: 1.5; }
        .nav-item.active .nav-icon { stroke: var(--of-blue); fill: rgba(0, 175, 240, 0.1); }
        .nav-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid var(--of-gray); }
        .nav-item.active .nav-avatar { border-color: var(--of-blue); }

        #loadingScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--of-bg);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            color: var(--of-blue); font-weight: bold; font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="loadingScreen">Mi Fans...</div>

        <!-- CABECERA TIPO ONLYFANS -->
        <header class="top-header">
            <div class="header-left">
                <img src="https://ui-avatars.com/api/?name=User&background=random" id="topAvatar" class="user-avatar-small" onclick="window.location.href='404.html'">
                <h1 class="logo-text">Mi Fans</h1>
            </div>
            <div class="header-actions">
                <!-- Ícono de Crear -->
                <svg class="action-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
                <!-- Botón Mensajes Corregido -->
                <svg class="action-icon" viewBox="0 0 24 24" onclick="window.location.href='bandeja.html'"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </header>

        <!-- CONTENIDO DESLIZABLE -->
        <main class="feed-container" id="feedContainer">
            
            <!-- CAJA DE NUEVA PUBLICACIÓN -->
            <div class="new-post-box">
                <input type="text" class="new-post-input" placeholder="Componer publicación nueva...">
                <svg class="new-post-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </div>

            <!-- HISTORIAS -->
            <div class="stories-container" id="storiesArea">
                <!-- Tu Historia -->
                <div class="story-item" onclick="window.location.href='404.html'">
                    <div class="story-ring add-story">
                        <img src="https://ui-avatars.com/api/?name=User&background=random" id="myStoryAvatar" class="story-avatar">
                        <div class="add-badge">+</div>
                    </div>
                    <span class="story-name">Tú</span>
                </div>
            </div>

            <!-- POSTS (NOTICIAS FAKE) -->
            <div id="postsArea"></div>
        </main>

        <!-- BARRA INFERIOR -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <div class="nav-item" onclick="window.location.href='bandeja.html'">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            </div>
            <div class="nav-item" onclick="window.location.href='404.html'">
                <img src="https://ui-avatars.com/api/?name=User&background=random" id="navAvatar" class="nav-avatar">
            </div>
        </nav>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBTp1VWtvkbSueprfAPhJ0EpxSmKfEwtzc",
            authDomain: "mi-fans-2d49e.firebaseapp.com",
            projectId: "mi-fans-2d49e",
            storageBucket: "mi-fans-2d49e.firebasestorage.app",
            messagingSenderId: "217541513154",
            appId: "1:217541513154:web:df760909e97bd3abb8905b"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection('usuarios').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        const defAvatar = `https://ui-avatars.com/api/?name=${data.nombre || 'Usuario'}&background=random`;
                        
                        document.getElementById('myStoryAvatar').src = data.fotoPerfil || defAvatar;
                        document.getElementById('navAvatar').src = data.fotoPerfil || defAvatar;
                        document.getElementById('topAvatar').src = data.fotoPerfil || defAvatar;
                    } 
                    document.getElementById('loadingScreen').style.display = 'none';
                    renderizarContenidoFake();
                    
                }).catch((error) => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    renderizarContenidoFake();
                });
            } else {
                window.location.href = "login.html";
            }
        });

        const fakeStories = [
            { name: "Revolution", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Rev" },
            { name: "Carlos", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Carlos" },
            { name: "Andrea", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Andrea" },
            { name: "Luis", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Luis" },
            { name: "Diana", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Diana" }
        ];

        const fakePosts = [
            { author: "Revolution Team", handle: "@revolution_of", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Rev", time: "2 horas", text: "¡Bienvenidos al nuevo diseño de Mi Fans! 🚀 Todo está más limpio y rápido. Déjanos un Tip si te gusta cómo se ve. 👇✨", image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600&auto=format&fit=crop", likes: "1,245", comments: "340" },
            { author: "Mariana Lopez", handle: "@mariana_l", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Mariana", time: "5 horas", text: "Un excelente día para programar un rato y tomar un buen café. El nuevo entorno está increíble. ☕💻", image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=600&auto=format&fit=crop", likes: "450", comments: "21" },
            { author: "Diana Garcia", handle: "@diana_exclusivo", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Diana", time: "1 día", text: "Increíble vista desde la oficina hoy. Sesión de fotos lista para ustedes. 📸🌆", image: "https://images.unsplash.com/photo-1449844908441-8829872d2607?q=80&w=600&auto=format&fit=crop", likes: "2,530", comments: "128" }
        ];

        function renderizarContenidoFake() {
            const storiesArea = document.getElementById('storiesArea');
            let storiesHTML = storiesArea.innerHTML; 
            fakeStories.forEach(story => { storiesHTML += `<div class="story-item"><div class="story-ring"><img src="${story.avatar}" class="story-avatar"></div><span class="story-name">${story.name}</span></div>`; });
            storiesArea.innerHTML = storiesHTML;

            const postsArea = document.getElementById('postsArea');
            let postsHTML = '';
            const verifiedSVG = `<svg class="verified-badge" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.4-6.4 1.5 1.5-7.9 7.9z"></path></svg>`;

            fakePosts.forEach(post => {
                postsHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-header-left"><img src="${post.avatar}" class="post-header-avatar"><div class="post-author-info"><span class="post-author-name">${post.author} ${verifiedSVG}</span><span class="post-author-handle">${post.handle}</span></div></div>
                            <div class="post-time">${post.time}</div>
                        </div>
                        <div class="post-text">${post.text}</div>
                        <img src="${post.image}" class="post-image">
                        <div class="post-actions-bar">
                            <div class="left-actions">
                                <div class="action-group"><svg class="post-action-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>${post.likes}</div>
                                <div class="action-group"><svg class="post-action-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>${post.comments}</div>
                            </div>
                            <div class="right-actions"><div class="tip-btn"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"></path></svg>Enviar propina</div></div>
                        </div>
                    </div>
                `;
            });
            postsArea.innerHTML = postsHTML;
        }
    </script>
</body>
</html>
